name: Build instalador

# Compila el instalador de Windows (PyInstaller + Inno Setup) en
# cada push de un tag v* (p. ej. v2.0.2) o al lanzarlo a mano desde
# la pestaña Actions. El instalador queda como artefacto del
# workflow; el release de GitHub lo publica el agente principal con
# ese archivo adjunto.
#
# El build NO se puede probar en el servidor de desarrollo (Linux):
# la primera corrida de este workflow es la prueba real. Si algo
# falla aquí, el log de Actions dice qué paso falló.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:


permissions:
  contents: write
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias y PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.22.3

      - name: Descargar ffmpeg (Gyan.dev, essentials)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-dl
          $dir = (Get-ChildItem ffmpeg-dl -Directory | Select-Object -First 1).FullName
          New-Item -ItemType Directory -Force -Path ffmpeg-bin | Out-Null
          Copy-Item "$dir\bin\ffmpeg.exe" -Destination ffmpeg-bin\
          Copy-Item "$dir\bin\ffprobe.exe" -Destination ffmpeg-bin\

      - name: Descargar modelo YuNet (con verificación SHA-256)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/opencv/opencv_zoo/raw/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx -OutFile face_detection_yunet_2023mar.onnx
          $sha = (Get-FileHash face_detection_yunet_2023mar.onnx -Algorithm SHA256).Hash.ToLower()
          if ($sha -ne "8f2383e4dd3cfbb4553ea8718107fc0423210dc964f9f4280604804ed2552fa4") { throw "SHA-256 del modelo YuNet no coincide: $sha" }

      - name: Compilar con PyInstaller
        run: pyinstaller clipia.spec

      - name: Verificar assets empaquetados
        shell: pwsh
        run: |
          if (-not (Test-Path dist\KellyAiClip\_internal\faster_whisper\assets\silero_vad_v6.onnx)) { throw "Falta silero_vad_v6.onnx en el paquete PyInstaller" }

      - name: Añadir ffmpeg y YuNet al paquete
        shell: pwsh
        run: |
          Copy-Item ffmpeg-bin\ffmpeg.exe, ffmpeg-bin\ffprobe.exe, face_detection_yunet_2023mar.onnx -Destination dist\KellyAiClip\

      - name: Prueba de humo (el .exe arranca)
        shell: pwsh
        run: |
          $salida = & dist\KellyAiClip\KellyAiClip.exe --version
          if ($salida -notmatch "KellyAiClip 2.0.2") { throw "El .exe no responde a --version: $salida" }

      - name: Instalar Inno Setup
        run: choco install innosetup -y

      - name: Compilar instalador
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" instalador\clipia.iss'

      - name: Tamaño del instalador
        shell: pwsh
        run: |
          $f = Get-Item instalador\Output\KellyAiClip-Setup-2.0.2.exe
          Write-Host ("Instalador: {0:N1} MB" -f ($f.Length / 1MB))
          $d = (Get-ChildItem dist\KellyAiClip -Recurse | Measure-Object Length -Sum).Sum
          Write-Host ("Carpeta dist: {0:N1} MB" -f ($d / 1MB))

      - name: Subir instalador
        uses: actions/upload-artifact@v4
        with:
          name: KellyAiClip-Setup-2.0.2
          path: instalador/Output/KellyAiClip-Setup-2.0.2.exe
          if-no-files-found: error

      - name: Adjuntar instalador al release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: instalador/Output/KellyAiClip-Setup-2.0.2.exe
